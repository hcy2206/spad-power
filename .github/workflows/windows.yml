name: Windows build & release
# Manual runs upload the exe as a workflow artifact; pushing a tag such as v0.2.0 also publishes a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(uv run --locked python -c "import spad_power; print(spad_power.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match spad_power.__version__ ($version)"
            exit 1
          fi
      - run: uv run --locked python scripts/build_windows.py
      - uses: actions/upload-artifact@v7
        with:
          name: SPAD-Power-Windows
          path: dist/SPAD-Power.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="SPAD-Power-$GITHUB_REF_NAME-windows-x64.exe"
          cp dist/SPAD-Power.exe "$asset"
          uv run --locked python scripts/release_notes.py "$GITHUB_REF_NAME" notes.md
          gh release create "$GITHUB_REF_NAME" "$asset" --title "SPAD-Power $GITHUB_REF_NAME" --notes-file notes.md
