[project]
name = "spad-power"
version = "0.1.0"
description = "SPAD target optical power calculator"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6>=6.8,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6.12,<7"]

[project.gui-scripts]
spad-power = "spad_power.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
